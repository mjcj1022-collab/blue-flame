# Render blueprint for the Blue Flame API.
# Deploy: Render → New → Blueprint → point at this repo. Render reads this file.
# Persistence lives in a hosted Turso (libSQL) database, so this runs on the
# FREE plan with no disk — accounts, orders and subscriptions survive deploys
# because the data is in Turso, not on the (ephemeral) free-tier filesystem.
services:
  - type: web
    name: blue-flame-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret for you
      - key: CLIENT_ORIGIN
        value: https://mjcj1022-collab.github.io   # the GitHub Pages origin (for CORS)
      # Persistent database — free Turso (https://turso.tech). Create a database,
      # then set these two from `turso db show <name> --url` and
      # `turso db tokens create <name>`. Without them it falls back to a local
      # file (fine for dev, wiped on redeploy on the free plan).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Live metal spot feed (OPTIONAL). Set METALS_API_KEY to your provider key
      # and quotes track the real gold/platinum market; unset → catalog spots.
      # Provider: 'metalpriceapi' (default, one request) or 'goldapi'.
      - key: METALS_API_KEY
        sync: false
      - key: METALS_PROVIDER
        sync: false
      # Stripe — set these in the Render dashboard → Environment (test keys first):
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Subscription / purchase price ids (from Stripe → Products). Needed to sell
      # access: STRIPE_PRICE_MONTHLY = the $40/mo recurring price, STRIPE_PRICE_OFFLINE
      # = the $450 one-time price. The paywall goes live once these + the keys are set.
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_OFFLINE
        sync: false

# NOTE: the free plan sleeps after ~15 min of inactivity (30–50s cold start on
# the next request). That's the tradeoff for $0 hosting; upgrade to a paid plan
# later to keep it always-on.
